<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KinoVault — Curated Cinema &amp; Series Streaming</title>
    <meta name="description" content="Stream curated independent films, public-domain classics, and original series on KinoVault." />
    <meta name="keywords" content="streaming, movies, series, cinema, independent film, 4k restorations" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KinoVault" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta property="og:title" content="KinoVault — Curated Cinema &amp; Series Streaming" />
    <meta property="og:description" content="Stream curated independent films, public-domain classics, and original series on KinoVault." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="kv-google-fonts" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var saved = localStorage.getItem('kv_theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-[#0b0b0f] dark:text-zinc-100 antialiased selection:bg-[var(--kv-accent,#e50914)] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
